[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rarvis-lighthouse"
version = "0.1.0"
description = "Records the goal, the evidence and the check results of a coding-agent mission, and tells you what is still missing."
requires-python = ">=3.11"
dependencies = []
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "setuptools==82.0.1",
    "wheel==0.47.0",
    "packaging==26.3",
    "iniconfig==2.3.1",
    "pluggy==1.6.0",
    "pygments==2.21.0",
]

[project.scripts]
rlh = "gcl.cli:main"
gcl = "gcl.cli:main"

[tool.setuptools.packages.find]
include = ["gcl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
